name: migrate

# Applies supabase/migrations/ to the Supabase project with the Supabase CLI.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: supabase-prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'jofgoferdnkihimvencr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the supabase-prod environment"; exit 1; fi
          done
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - name: Next steps
        run: |
          msg="Migrations applied. Next: in Supabase, Project Settings -> API -> Exposed schemas, add 'api' (only api). Then run the replay workflow with seed ticked and reset_to = 85."
          echo "::notice title=Expose the api schema::$msg"
          { echo "### Migrations applied"; echo; echo "1. Supabase -> Project Settings -> API -> Exposed schemas: add \`api\` (keep the other new schemas private)."; echo "2. Actions -> replay -> Run workflow with **seed** ticked and **reset_to = 85**."; } >> "$GITHUB_STEP_SUMMARY"
