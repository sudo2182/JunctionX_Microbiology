name: ecdc-announcements

# ECDC RSS feeds -> bench.announcements (api.announcements). Real-world news, so separate from the simulated weekly
# replay. Each ECDC feed lists only its latest ~10 items, hence daily. Run it with "Run workflow"; the daily cron
# only runs once the repository variable ANNOUNCEMENTS_CRON_ENABLED is set to "true" (after migration
# 20261019000001 is applied).

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and classify only; write nothing"
        type: boolean
        default: false
      only_relevant:
        description: "Store only 'relevant' and 'review' items"
        type: boolean
        default: false

concurrency:
  group: ecdc-announcements
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.ANNOUNCEMENTS_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: supabase-prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Check ECDC feeds
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          ONLY_REL: ${{ github.event_name == 'workflow_dispatch' && inputs.only_relevant && '--only-relevant' || '' }}
        run: |
          if [ -z "$DRY_RUN" ] && [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set in the supabase-prod environment (see README.md)."
            exit 1
          fi
          python -m pipeline.announcements --db $DRY_RUN $ONLY_REL
